name: fieldsure_mobile
description: "FieldSure — Digital Companion for Field Drug Testing"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Networking
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.4

  # Camera
  camera: ^0.11.1

  # Location
  geolocator: ^13.0.3

  # Permissions
  permission_handler: ^11.4.0

  # Image processing
  image: ^4.5.5

  # Local database (offline) — Drift (SQLite-based, actively maintained)
  drift: ^2.26.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.31

  # Secure storage
  flutter_secure_storage: ^9.2.4

  # Background sync
  workmanager: ^0.10.10

  # Biometric auth
  local_auth: ^2.3.0

  # Device info
  device_info_plus: ^11.1.1
  package_info_plus: ^8.1.2

  # Certificate pinning
  dio_smart_retry: ^6.0.0


  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  crypto: ^3.0.6
  path_provider: ^2.1.5
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  flutter_dotenv: ^5.2.1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Testing
  mocktail: ^1.0.4

  # Code generation
  build_runner: ^2.4.15
  freezed: ^3.0.2
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.3

  # Drift generator
  drift_dev: ^2.26.0

flutter:
  generate: true
  uses-material-design: true

dependency_overrides:
  frontend_server_client: ^4.0.0
  platform: ^3.1.4
  flutter_plugin_android_lifecycle: ^2.0.35
  win32: 3.1.4
  win32_registry: 2.1.0
  path_provider_windows: 2.1.3
  flutter_secure_storage_windows: 2.1.1
